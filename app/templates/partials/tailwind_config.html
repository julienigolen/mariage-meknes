      extend: {

          surface: '#FDF8EF',   /* cartes, champs */
          sable:   '#EADCC4',   /* section d'accent */
          bord:    { DEFAULT: '#D9C7A9', fort: '#9C8455' },  /* filets · bordure de champ (3.40:1) */
